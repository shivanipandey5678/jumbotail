<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroSearch - Smart Search for Electronics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
    .toast-enter { animation: slideIn 0.3s ease-out; }
    .toast-exit { animation: slideOut 0.3s ease-in; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Backend API runs on port 3000, frontend on port 3001
    const API_BASE = 'http://localhost:3000';

    // ========================================================================
    // TOAST COMPONENT
    // ========================================================================
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const timer = setTimeout(onClose, 5000);
        return () => clearTimeout(timer);
      }, []);

      const styles = {
        success: 'bg-green-500',
        error: 'bg-red-500',
        info: 'bg-blue-500',
        warning: 'bg-yellow-500'
      };

      const icons = {
        success: '✓',
        error: '✕',
        info: 'ℹ',
        warning: '⚠'
      };

      return (
        <div className={`${styles[type]} text-white px-6 py-4 rounded-lg shadow-lg toast-enter flex items-center justify-between min-w-[320px] max-w-[500px]`}>
          <div className="flex items-center gap-3">
            <span className="text-2xl">{icons[type]}</span>
            <span className="text-sm">{message}</span>
          </div>
          <button onClick={onClose} className="ml-4 text-white hover:text-gray-200 text-xl">
            ×
          </button>
        </div>
      );
    }

    function ToastContainer({ toasts, removeToast }) {
      return (
        <div className="fixed top-4 right-4 z-50 space-y-2">
          {toasts.map((toast) => (
            <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => removeToast(toast.id)} />
          ))}
        </div>
      );
    }

    // ========================================================================
    // MAIN APP
    // ========================================================================
    function App() {
      const [query, setQuery] = useState('');
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [showAddProduct, setShowAddProduct] = useState(false);
      const [showUpdateMetadata, setShowUpdateMetadata] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [toasts, setToasts] = useState([]);
      const searchTimeoutRef = useRef(null);

      const addToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
      };

      const removeToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      // Debounced search (prevent rapid requests)
      const handleSearch = async (searchQuery = query) => {
        const trimmed = searchQuery.trim();
        
        if (!trimmed) {
          addToast('Please enter a search query', 'warning');
          return;
        }

        if (trimmed.length > 500) {
          addToast('Query too long (max 500 characters)', 'error');
          return;
        }

        // Debounce: clear previous timeout
        if (searchTimeoutRef.current) {
          clearTimeout(searchTimeoutRef.current);
        }

        setLoading(true);
        
        searchTimeoutRef.current = setTimeout(async () => {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout

            const res = await fetch(`${API_BASE}/api/v1/search/product?query=${encodeURIComponent(trimmed)}`, {
              signal: controller.signal
            });
            
            clearTimeout(timeoutId);

            if (!res.ok) {
              const error = await res.json();
              throw new Error(error.message || 'Search failed');
            }
            
            const data = await res.json();
            setResults(data.data || []);
            
            if (data.data.length === 0) {
              addToast('No products found. Try a different query.', 'info');
            } else {
              addToast(`Found ${data.data.length} products in ${data._performance?.duration_ms || 0}ms`, 'success');
            }
          } catch (err) {
            if (err.name === 'AbortError') {
              addToast('Request timeout. Server took too long to respond.', 'error');
            } else {
              addToast(`Search failed: ${err.message}. Make sure server is running.`, 'error');
            }
            setResults([]);
          } finally {
            setLoading(false);
          }
        }, 300); // 300ms debounce
      };

      const openUpdateMetadata = (product) => {
        setSelectedProduct(product);
        setShowUpdateMetadata(true);
      };

      const refreshSearch = () => {
        if (query.trim()) {
          handleSearch(query);
        }
      };

      return (
        <div className="min-h-screen">
          <ToastContainer toasts={toasts} removeToast={removeToast} />

          {/* Header */}
          <header className="bg-white shadow-sm border-b sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                  E
                </div>
                <h1 className="text-xl font-bold text-gray-900">ElectroSearch</h1>
              </div>
              <button
                onClick={() => setShowAddProduct(true)}
                className="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 font-medium transition-all hover:scale-105"
              >
                + Add Product
              </button>
            </div>
          </header>

          {/* Hero */}
          <div className="bg-gradient-to-br from-blue-50 to-indigo-50 py-16">
            <div className="max-w-4xl mx-auto px-4 text-center">
              <div className="inline-block px-4 py-2 bg-orange-100 text-orange-700 rounded-full text-sm font-medium mb-4">
                ✨ Smart Search for Electronics
              </div>
              <h2 className="text-4xl font-bold text-gray-900 mb-4">
                Find the Best Electronics at <span className="text-blue-600">Unbeatable Prices</span>
              </h2>
              <p className="text-gray-600 mb-8">
                Search in your language — "Sasta iPhone", "Latest Samsung", "Budget laptop"
              </p>

              <div className="max-w-2xl mx-auto">
                <div className="relative">
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && !loading && handleSearch()}
                    placeholder="Search for phones, laptops, accessories..."
                    maxLength="500"
                    className="w-full px-6 py-4 pr-32 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:outline-none text-lg"
                  />
                  <button
                    onClick={() => handleSearch()}
                    disabled={loading}
                    className="absolute right-2 top-1/2 -translate-y-1/2 px-8 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                  >
                    {loading ? <div className="spinner mx-auto"></div> : 'Search'}
                  </button>
                </div>
              </div>

              <div className="mt-6 flex items-center justify-center gap-3 flex-wrap">
                <span className="text-sm text-gray-500">📈 Popular</span>
                {['iPhone 16', 'Sasta iPhone', 'Latest Samsung', 'Laptop under 50k'].map(term => (
                  <button
                    key={term}
                    onClick={() => { setQuery(term); handleSearch(term); }}
                    className="px-4 py-2 bg-white rounded-full text-sm hover:bg-gray-50 border transition-all hover:scale-105"
                  >
                    {term}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Results */}
          {results.length > 0 && (
            <div className="max-w-7xl mx-auto px-4 py-8">
              <div className="flex items-center justify-between mb-6">
                <h3 className="text-2xl font-bold">Search Results ({results.length})</h3>
                <button onClick={() => setResults([])} className="text-gray-500 hover:text-gray-700">
                  Clear
                </button>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {results.map(product => (
                  <ProductCard 
                    key={product.productId} 
                    product={product}
                    onUpdateMetadata={openUpdateMetadata}
                  />
                ))}
              </div>
            </div>
          )}

          {/* Features */}
          {results.length === 0 && !loading && (
            <div className="max-w-7xl mx-auto px-4 py-16">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                <FeatureCard icon="⚡" title="Lightning Fast" description="Get instant results with smart autocomplete" color="blue" />
                <FeatureCard icon="✨" title="Smart Search" description="Understands natural language — search how you think" color="orange" />
                <FeatureCard icon="📈" title="Best Deals" description="Compare prices and find the best value" color="green" />
              </div>
            </div>
          )}

          {/* Modals */}
          {showAddProduct && (
            <AddProductModal 
              onClose={() => setShowAddProduct(false)}
              addToast={addToast}
              onSuccess={refreshSearch}
            />
          )}

          {showUpdateMetadata && selectedProduct && (
            <UpdateMetadataModal
              product={selectedProduct}
              onClose={() => { setShowUpdateMetadata(false); setSelectedProduct(null); }}
              addToast={addToast}
              onSuccess={(updatedProduct) => {
                setResults(prev => prev.map(p => 
                  p.productId === updatedProduct.productId ? {...p, metadata: updatedProduct.Metadata} : p
                ));
                addToast('Product card updated with new metadata!', 'success');
              }}
            />
          )}
        </div>
      );
    }

    // ========================================================================
    // PRODUCT CARD
    // ========================================================================
    function ProductCard({ product, onUpdateMetadata }) {
      const discount = product.mrp > 0 ? Math.round((product.mrp - product.sellingPrice) / product.mrp * 100) : 0;
      const inStock = product.stock > 0;

      return (
        <div className="bg-white rounded-xl shadow-sm border hover:shadow-lg transition-all p-6">
          <div className="flex items-start justify-between mb-3">
            <h4 className="font-semibold text-gray-900 line-clamp-2 flex-1">{product.title}</h4>
            {discount > 0 && (
              <span className="ml-2 px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded shrink-0">
                {discount}% OFF
              </span>
            )}
          </div>
          
          <p className="text-sm text-gray-600 line-clamp-2 mb-4">{product.description}</p>
          
          <div className="flex items-baseline gap-2 mb-3">
            <span className="text-2xl font-bold text-gray-900">₹{product.sellingPrice?.toLocaleString()}</span>
            {product.mrp > product.sellingPrice && (
              <span className="text-sm text-gray-400 line-through">₹{product.mrp?.toLocaleString()}</span>
            )}
          </div>

          {product.rating !== undefined && (
            <div className="flex items-center gap-2 mb-3">
              <div className="flex">
                {[1,2,3,4,5].map(star => (
                  <span key={star} className={`text-lg ${star <= Math.round(product.rating) ? 'text-yellow-400' : 'text-gray-300'}`}>
                    ★
                  </span>
                ))}
              </div>
              <span className="text-sm text-gray-600">{product.rating?.toFixed(1)}</span>
            </div>
          )}

          {/* Metadata Display */}
          {product.metadata && Object.keys(product.metadata).some(k => product.metadata[k]) && (
            <div className="mb-3 bg-blue-50 rounded-lg p-3 border border-blue-100">
              <div className="text-xs font-medium text-blue-900 mb-2">📋 Specifications:</div>
              <div className="flex flex-wrap gap-2">
                {Object.entries(product.metadata).filter(([k, v]) => v).slice(0, 6).map(([key, value]) => (
                  <span key={key} className="px-2 py-1 bg-white text-blue-700 text-xs rounded border border-blue-200">
                    <strong>{key}:</strong> {value}
                  </span>
                ))}
              </div>
            </div>
          )}

          <div className="flex items-center justify-between pt-3 border-t mt-3">
            <span className={`text-sm font-medium ${inStock ? 'text-green-600' : 'text-red-600'}`}>
              {inStock ? `✓ ${product.stock} in stock` : '✕ Out of stock'}
            </span>
            <button
              onClick={() => onUpdateMetadata(product)}
              className="px-3 py-1.5 bg-blue-600 text-white text-sm rounded hover:bg-blue-700 transition-all hover:scale-105"
            >
              🔧 Update Specs
            </button>
          </div>
        </div>
      );
    }

    // ========================================================================
    // FEATURE CARD
    // ========================================================================
    function FeatureCard({ icon, title, description, color }) {
      const colors = {
        blue: 'bg-blue-50 text-blue-600',
        orange: 'bg-orange-50 text-orange-600',
        green: 'bg-green-50 text-green-600'
      };

      return (
        <div className="text-center">
          <div className={`inline-flex items-center justify-center w-16 h-16 rounded-2xl ${colors[color]} text-3xl mb-4`}>
            {icon}
          </div>
          <h3 className="text-xl font-bold text-gray-900 mb-2">{title}</h3>
          <p className="text-gray-600">{description}</p>
        </div>
      );
    }

    // ========================================================================
    // ADD PRODUCT MODAL (WITH VALIDATION)
    // ========================================================================
    function AddProductModal({ onClose, addToast, onSuccess }) {
      const [formData, setFormData] = useState({
        title: '', description: '', rating: '', stock: '', price: '', mrp: '', currency: 'Rupee'
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        // Frontend validation
        const rating = parseFloat(formData.rating);
        const stock = parseInt(formData.stock);
        const price = parseInt(formData.price);
        const mrp = parseInt(formData.mrp);

        if (rating < 0 || rating > 5) {
          addToast('Rating must be between 0 and 5', 'error');
          return;
        }
        if (stock < 0) {
          addToast('Stock cannot be negative', 'error');
          return;
        }
        if (price < 0) {
          addToast('Price cannot be negative', 'error');
          return;
        }
        if (mrp < 0) {
          addToast('MRP cannot be negative', 'error');
          return;
        }
        if (price > mrp) {
          addToast('Price cannot exceed MRP', 'error');
          return;
        }

        setLoading(true);

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);

          const res = await fetch(`${API_BASE}/api/v1/product`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...formData,
              rating, stock, price, mrp
            }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);
          const data = await res.json();

          if (res.ok) {
            addToast(`✓ Product added successfully! ID: ${data.productId}`, 'success');
            onClose();
            if (onSuccess) onSuccess();
          } else {
            const errors = data.errors ? data.errors.join(', ') : data.message;
            addToast(`✕ Error: ${errors}`, 'error');
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            addToast('Request timeout', 'error');
          } else {
            addToast('Network error. Make sure server is running at http://localhost:3000', 'error');
          }
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
              <h2 className="text-2xl font-bold">+ Add New Product</h2>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">×</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">Product Title *</label>
                  <input required maxLength="500" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})}
                    placeholder="e.g., iPhone 16 Pro" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Rating (0-5) *</label>
                  <input required type="number" step="0.1" min="0" max="5" value={formData.rating}
                    onChange={(e) => setFormData({...formData, rating: e.target.value})}
                    placeholder="4.5" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">Selling Price (₹) *</label>
                  <input required type="number" min="0" value={formData.price}
                    onChange={(e) => setFormData({...formData, price: e.target.value})}
                    placeholder="79999" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">MRP (₹) *</label>
                  <input required type="number" min="0" value={formData.mrp}
                    onChange={(e) => setFormData({...formData, mrp: e.target.value})}
                    placeholder="99999" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">Stock Quantity *</label>
                  <input required type="number" min="0" step="1" value={formData.stock}
                    onChange={(e) => setFormData({...formData, stock: e.target.value})}
                    placeholder="100" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Currency</label>
                  <select value={formData.currency} onChange={(e) => setFormData({...formData, currency: e.target.value})}
                    className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                    <option>Rupee</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium mb-1">Description *</label>
                <textarea required maxLength="5000" value={formData.description}
                  onChange={(e) => setFormData({...formData, description: e.target.value})}
                  placeholder="Product description..." rows="3"
                  className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500"></textarea>
              </div>

              <div className="flex gap-3 pt-4">
                <button type="button" onClick={onClose} className="flex-1 px-4 py-3 border rounded-lg hover:bg-gray-50 font-medium">
                  Cancel
                </button>
                <button type="submit" disabled={loading}
                  className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? 'Adding...' : 'Add Product'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ========================================================================
    // UPDATE METADATA MODAL (ENHANCED WITH VALIDATION)
    // ========================================================================
    function UpdateMetadataModal({ product, onClose, addToast, onSuccess }) {
      const [metadata, setMetadata] = useState({
        ram: product.metadata?.ram || '',
        storage: product.metadata?.storage || '',
        color: product.metadata?.color || '',
        screensize: product.metadata?.screensize || '',
        model: product.metadata?.model || '',
        brightness: product.metadata?.brightness || ''
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);

        try {
          // Filter empty values and trim
          const filteredMetadata = {};
          Object.keys(metadata).forEach(key => {
            const value = metadata[key]?.toString().trim();
            if (value && value !== '') {
              if (value.length > 1000) {
                throw new Error(`${key} value too long (max 1000 chars)`);
              }
              filteredMetadata[key] = value;
            }
          });

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);

          const res = await fetch(`${API_BASE}/api/v1/product/meta-data`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              productId: product.productId,
              Metadata: filteredMetadata
            }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);
          const data = await res.json();

          if (res.ok) {
            addToast(`✓ Metadata updated for Product #${data.productId}!`, 'success');
            onSuccess(data);
            onClose();
          } else {
            const errors = data.errors ? data.errors.join(', ') : data.message;
            addToast(`✕ Error: ${errors}`, 'error');
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            addToast('Request timeout', 'error');
          } else {
            addToast(`Error: ${err.message}`, 'error');
          }
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="sticky top-0 bg-white border-b px-6 py-4">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-2xl font-bold">🔧 Update Product Specifications</h2>
                  <p className="text-sm text-gray-600 mt-1">
                    {product.title} <span className="text-gray-400">(ID: {product.productId})</span>
                  </p>
                </div>
                <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">×</button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              {/* Instructions */}
              <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-500 rounded-lg p-4">
                <div className="flex items-start gap-3">
                  <span className="text-blue-600 text-xl shrink-0">💡</span>
                  <div>
                    <p className="text-sm text-blue-900 font-semibold mb-2">How to Update Metadata:</p>
                    <ul className="text-sm text-blue-800 space-y-1">
                      <li>✓ Fill in any specifications you want to update</li>
                      <li>✓ Leave fields empty to keep existing values</li>
                      <li>✓ Click "Update Metadata" to save changes</li>
                      <li>✓ You'll see changes instantly in the product card</li>
                    </ul>
                  </div>
                </div>
              </div>

              {/* Current Metadata */}
              {product.metadata && Object.keys(product.metadata).filter(k => product.metadata[k]).length > 0 && (
                <div className="bg-gray-50 rounded-lg p-4 border">
                  <p className="text-sm font-medium text-gray-700 mb-2">📦 Current Specifications:</p>
                  <div className="flex flex-wrap gap-2">
                    {Object.entries(product.metadata).filter(([k, v]) => v).map(([key, value]) => (
                      <span key={key} className="px-2 py-1 bg-white text-gray-700 text-xs rounded border">
                        <strong>{key}:</strong> {value}
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {/* Form Fields */}
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">RAM</label>
                  <input maxLength="50" value={metadata.ram} onChange={(e) => setMetadata({...metadata, ram: e.target.value})}
                    placeholder="e.g., 8GB, 16GB" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Storage</label>
                  <input maxLength="50" value={metadata.storage} onChange={(e) => setMetadata({...metadata, storage: e.target.value})}
                    placeholder="e.g., 128GB, 256GB" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">Color</label>
                  <input maxLength="50" value={metadata.color} onChange={(e) => setMetadata({...metadata, color: e.target.value})}
                    placeholder="e.g., Black, White, Red" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Screen Size</label>
                  <input maxLength="50" value={metadata.screensize} onChange={(e) => setMetadata({...metadata, screensize: e.target.value})}
                    placeholder="e.g., 6.1 inches" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">Model</label>
                  <input maxLength="100" value={metadata.model} onChange={(e) => setMetadata({...metadata, model: e.target.value})}
                    placeholder="e.g., iPhone 16 Pro" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Brightness</label>
                  <input maxLength="50" value={metadata.brightness} onChange={(e) => setMetadata({...metadata, brightness: e.target.value})}
                    placeholder="e.g., 300 nits" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div className="flex gap-3 pt-4">
                <button type="button" onClick={onClose} className="flex-1 px-4 py-3 border rounded-lg hover:bg-gray-50 font-medium">
                  Cancel
                </button>
                <button type="submit" disabled={loading}
                  className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? 'Updating...' : '✓ Update Metadata'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
